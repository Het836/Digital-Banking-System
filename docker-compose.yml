services:


  redis:
    image: redis:latest
    container_name: redis-dbs
    ports:
      - "6379:6379"
    networks:
      - banking-network

  mysql:
    image: mysql:8.0
    container_name: mysql-dbs
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - banking-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper-dbs
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - banking-network


  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka-dbs
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - banking-network

  # ---------- APP SERVICES ----------

  account-service:
    image: digital-banking/account-service:local
    build:
      context: ./account-service
      dockerfile: Dockerfile
    container_name: account-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/dbs_account_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      - mysql
      - kafka
    restart: unless-stopped
    networks:
      - banking-network

  transaction-service:
    image: digital-banking/transaction-service:local
    build:
      context: ./transaction-service
      dockerfile: Dockerfile
    container_name: transaction-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/dbs_transaction_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis
      ACCOUNT_SERVICE_URL: http://account-service:8081
    depends_on:
      - mysql
      - kafka
      - redis
      - account-service
    restart: unless-stopped
    networks:
      - banking-network

  payment-service:
    image: digital-banking/payment-service:local
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: payment-service
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/dbs_payment_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
    depends_on:
      - mysql
      - kafka
    restart: unless-stopped
    networks:
      - banking-network

  fraud-detection-service:
    image: digital-banking/fraud-detection-service:local
    build:
      context: ./fraud-detection-service
      dockerfile: Dockerfile
    container_name: fraud-detection-service
    ports:
      - "8084:8084"
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ACCOUNT_SERVICE_URL: http://account-service:8081
    depends_on:
      - kafka
      - redis
      - account-service
    restart: unless-stopped
    networks:
      - banking-network

  notification-service:
    image: digital-banking/notification-service:local
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    ports:
      - "8085:8085"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      - kafka
    restart: unless-stopped
    networks:
      - banking-network

  api-gateway:
    image: digital-banking/api-gateway:local
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_REDIS_HOST: redis
      GATEWAY_ACCOUNT_RATE_LIMIT: 100
      GATEWAY_ACCOUNT_BURST_CAPACITY: 200
      GATEWAY_TRANSACTION_RATE_LIMIT: 100
      GATEWAY_TRANSACTION_BURST_CAPACITY: 200
      GATEWAY_PAYMENT_RATE_LIMIT: 50
      GATEWAY_PAYMENT_BURST_CAPACITY: 100
    depends_on:
      - account-service
      - transaction-service
      - payment-service
    restart: unless-stopped
    networks:
      - banking-network

volumes:
  mysql-data:

networks:
  banking-network:
    driver: bridge
