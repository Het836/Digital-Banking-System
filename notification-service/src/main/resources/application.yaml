spring:
  application:
    name: notification-service
  mail:
    host: ${SPRING_MAIL_HOST:mailpit}
    port: ${SPRING_MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  kafka:
    bootstrap-servers: kafka:29092
    consumer:
      group-id: notification-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring:
          json:
            trusted:
              packages: "*"
            use:
              type:
                headers: false
            value:
              default:
                type: java.util.HashMap

server:
  port: 8085

account:
  service:
    url: ${ACCOUNT_SERVICE_URL:http://account-service:8081}

notification:
  mail:
    from: ${NOTIFICATION_MAIL_FROM:no-reply@digitalbank.local}

management:
  endpoints:
    web:
      exposure:
        include: health,info
